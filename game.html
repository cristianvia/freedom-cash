<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Freedom Cash · Construye tu libertad</title>
  <meta name="theme-color" content="#0d1017" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Freedom Cash" />
  <!-- El ?v= se sube a mano al desplegar. Sin el, el navegador sirve la
       hoja vieja de cache y la interfaz nueva sale sin estilos: paso una
       tarde persiguiendo un tutorial que estaba ahi pero invisible. -->
  <link rel="stylesheet" href="css/game.css?v=3" />
</head>
<body>

  <!-- La ciudad ocupa la pantalla entera. Todo lo demás flota encima. -->
  <div id="stage"></div>

  <!-- ===== Recursos: lo único permanentemente visible ===== -->
  <header id="hud">
    <div class="res" id="res-cash"><span class="ic">💶</span><b>0</b></div>
    <div class="res" id="res-mat"><span class="ic">🧱</span><b>0</b><i class="cap">/50</i></div>
    <div class="res lvl" id="res-lvl">
      <span class="ic">⭐</span><b>1</b>
      <span class="xp"><i></i></span>
    </div>
  </header>

  <!-- El Indicador de Emancipación es la identidad del juego: barra fija. -->
  <button id="ie" aria-label="Indicador de emancipación">
    <span class="ie-bar"><i></i><u></u></span>
    <span class="ie-txt"><b>0%</b> hacia la libertad</span>
  </button>

  <!-- El encargo activo, siempre a la vista. Es lo que contesta a «¿y ahora
       qué hago?», que era la pregunta que el juego dejaba sin responder. -->
  <button id="quest" hidden>
    <span class="q-em">🎯</span>
    <span class="q-tx"><b></b><i></i></span>
    <span class="q-bar"><u></u></span>
  </button>

  <!-- ===== Acciones: abajo, al alcance del pulgar ===== -->
  <nav id="dock">
    <button class="dk" id="dk-shop"><span class="dk-i">🏗️</span><span class="dk-l">Construir</span></button>
    <button class="dk" id="dk-collect"><span class="dk-i">💰</span><span class="dk-l">Cobrar</span><i class="badge" hidden></i></button>
    <button class="dk" id="dk-builders"><span class="dk-i">👷</span><span class="dk-l">Obras</span><i class="badge" hidden></i></button>
    <button class="dk" id="dk-menu"><span class="dk-i">☰</span><span class="dk-l">Más</span><i class="badge" hidden></i></button>
  </nav>

  <!-- ===== Cajón inferior: tienda, fichas, asesores ===== -->
  <div id="sheet" hidden>
    <div class="sh-grab"></div>
    <div class="sh-head"><h2></h2><button class="sh-x" aria-label="Cerrar">✕</button></div>
    <div class="sh-body"></div>
  </div>
  <div id="scrim" hidden></div>

  <!-- ===== Avisos flotantes ===== -->
  <div id="toast" hidden></div>

  <!-- ===== Arranque: elegir perfil ===== -->
  <div id="onboard">
    <div class="ob-card">
      <h1>Freedom Cash</h1>
      <p class="ob-lead">Construye una ciudad que te pague por vivir.</p>
      <div class="ob-steps"></div>
    </div>
  </div>

  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/boot.js"></script>
</body>
</html>
